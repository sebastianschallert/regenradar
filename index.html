<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Regenradar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --paper:#F4F4F1; --card:#FFFFFF; --hair:#DDDDD6; --hair2:#E9E9E4;
    --ink:#141513; --gray:#70746F; --signal:#E03131;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--paper);font-family:var(--body);color:var(--ink);overflow:hidden}
  #map{position:fixed;inset:0;background:var(--paper)}
  .leaflet-container{background:var(--paper)}
  .leaflet-control-zoom{display:none}
  .leaflet-control-attribution{background:rgba(244,244,241,.75)!important;color:var(--gray)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--gray)!important}
  .morphcanvas{pointer-events:none;opacity:.78}

  .splash{position:fixed;inset:0;z-index:3000;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .45s ease}
  .splash.done{opacity:0;pointer-events:none}
  .splash h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .splash .sub{font-size:10px;font-weight:500;color:var(--gray);letter-spacing:.14em;
    text-transform:uppercase;margin-top:6px}
  .splash .pct{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;margin-top:42px;line-height:1}
  .splash .bar{width:min(280px,70vw);height:6px;background:var(--hair2);margin-top:18px;position:relative}
  .splash .bar i{position:absolute;top:0;bottom:0;width:35%;background:var(--signal);
    border-radius:3px;animation:barSlide 1.1s ease-in-out infinite}
  @keyframes barSlide{0%{left:-35%}50%{left:50%}100%{left:100%}}
  .splash .stat{font-size:10px;font-weight:500;color:var(--gray);letter-spacing:.1em;
    text-transform:uppercase;margin-top:14px;min-height:13px}

  .hdr{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;
    background:linear-gradient(var(--paper) 55%,rgba(244,244,241,0));pointer-events:none}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .hdr .right{display:flex;align-items:center;gap:10px;pointer-events:auto}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--signal)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);position:relative}
  .live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--signal);
    animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(1.6);opacity:0}}
  .live.off{color:var(--gray)}
  .live.off .dot{background:var(--gray)}
  .live.off .dot::after{display:none}
  .locbtn{background:var(--card);border:1px solid var(--hair);color:var(--ink);
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    font-size:17px;cursor:pointer;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.06);flex:0 0 auto}
  .locbtn:active{transform:scale(.94)}
  .locbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);
    border-top:1px solid var(--hair);
    padding:15px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .row{display:flex;align-items:center;gap:13px}
  .playbtn{flex:0 0 auto;width:46px;height:46px;border-radius:4px;border:none;cursor:pointer;
    background:var(--signal);color:#fff;font-size:17px;display:grid;place-items:center}
  .playbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .timeinfo{flex:1;min-width:0}
  .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
  .rel{font-size:11px;font-weight:500;color:var(--gray);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .nowbtn{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.12em;cursor:pointer;
    padding:6px 10px;border-radius:2px;border:1px solid var(--hair);background:var(--card);color:var(--gray)}
  .nowbtn:active{transform:scale(.95)}
  .badge{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.12em;
    padding:5px 9px;border-radius:2px;border:1px solid var(--ink);color:var(--ink)}
  .badge.fc{border-color:var(--signal);color:var(--signal)}

  .nc{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair2);
    display:none;flex-direction:column;gap:5px}
  .nc.show{display:flex}
  .nc .ncmetrics{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .nc .met{display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums}
  .nc .met .v{font-size:20px;font-weight:700;color:var(--ink);line-height:1}
  .nc .met .u{font-size:11px;font-weight:500;color:var(--gray)}
  .nc .met.rainon .v{color:var(--signal)}
  .nc .ncmsep{font-size:13px;color:var(--hair);font-weight:300}
  .nc .ncbottom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray)}
  .nc .ncloc{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .nc .ncbottom b{color:var(--ink);font-weight:600}
  .nc .agree{display:none;align-items:center;gap:7px;margin-top:7px;
    font-size:12px;color:var(--gray)}
  .nc .agree.show{display:flex}
  .nc .agreedot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--gray)}
  .nc .agree.high .agreedot{background:#2FA84F}      /* grün: einig */
  .nc .agree.mid .agreedot{background:#E8A23D}       /* gelb: teils */
  .nc .agree.low .agreedot{background:var(--signal)} /* rot: uneinig */
  .nc .agree b{color:var(--ink);font-weight:600}
  .nc .agree{flex-wrap:wrap}
  .mchip{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:500;
    padding:1px 5px;border-radius:100px;border:1px solid var(--hair2);color:var(--gray)}
  .mchip.wet{color:#2671c4;border-color:rgba(38,113,196,.3)}
  .mchip.dry{color:#9a8030;border-color:rgba(154,128,48,.25)}

  .tl{margin-top:14px}
  .track{position:relative;height:54px;touch-action:none;cursor:grab;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .track:active{cursor:grabbing}
  .strip{position:absolute;top:0;bottom:0;left:0;will-change:transform}
  .striprail{position:absolute;left:0;right:0;top:14px;height:14px;background:var(--hair2)}
  .striprail .fut{position:absolute;top:0;bottom:0;
    background:repeating-linear-gradient(90deg,var(--hair2) 0 4px,var(--hair) 4px 5px)}
  .seg{position:absolute;top:3px;bottom:3px;width:1px;background:#D6D6CF}
  .seg.hour{top:0;bottom:0;background:#B9B9B0}
  .hlabel{position:absolute;top:35px;transform:translateX(-50%);
    font-size:10px;font-weight:500;color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
  .aromemark{position:absolute;top:8px;height:26px;width:1px;background:var(--hair);border-left:1px dashed var(--gray);opacity:.6}
  .aromemark::after{content:"VORHERSAGE";position:absolute;top:-11px;left:4px;
    font-size:7.5px;font-weight:700;letter-spacing:.1em;color:var(--gray);white-space:nowrap}
  .nowmk{position:absolute;top:11px;height:20px;width:2px;background:var(--ink)}
  .nowmk::after{content:"JETZT";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-size:8px;font-weight:700;letter-spacing:.13em;color:var(--gray)}
  .playhead{position:absolute;left:50%;top:10px;height:22px;width:2px;background:var(--signal);
    transform:translateX(-50%);pointer-events:none;z-index:2}
  .playhead::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
    border:4px solid transparent;border-top:5px solid var(--signal)}

  .legend{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:999;
    background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:10px 9px;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .lbar{width:8px;height:110px;
    background:linear-gradient(to top,
      rgba(147,167,201,.85) 0 14%,#3E8FF3 14% 28%,#2362D2 28% 42%,
      #3F48CC 42% 57%,#7C3AED 57% 71%,#E03131 71% 86%,#7A1212 86% 100%)}
  .legend span{font-size:8.5px;font-weight:500;color:var(--gray);letter-spacing:.08em;
    writing-mode:vertical-rl;transform:rotate(180deg)}

  .toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);
    z-index:1100;background:var(--ink);color:var(--paper);border-radius:4px;max-width:88%;
    padding:9px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  .toast.show{opacity:1}

  @media (prefers-reduced-motion:reduce){.live .dot::after{animation:none}}

  /* --- Ortswähler-Button im Header --- */
  .placebtn{display:flex;align-items:center;gap:5px;background:var(--card);
    border:1px solid var(--hair);border-radius:100px;padding:7px 12px 7px 11px;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;pointer-events:auto;
    box-shadow:0 1px 3px rgba(0,0,0,.06);max-width:160px}
  .placebtn .pin-ic{font-size:13px;color:var(--signal);flex:0 0 auto}
  .placebtn #placeLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .placebtn .chev{font-size:12px;color:var(--gray);flex:0 0 auto;margin-top:-2px}
  .placebtn:active{transform:scale(.97)}

  /* --- Such-Overlay --- */
  .placesheet{position:fixed;inset:0;z-index:2000;background:rgba(20,21,19,.28);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;justify-content:center;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 60px) 16px 16px}
  .placesheet[hidden]{display:none}
  .ps-card{width:100%;max-width:420px;background:var(--card);border-radius:14px;
    overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:psIn .18s ease}
  @keyframes psIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .ps-search{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:1px solid var(--hair2)}
  .ps-search .ps-ic{font-size:17px;color:var(--gray);flex:0 0 auto}
  .ps-search input{flex:1;border:none;outline:none;font-size:16px;font-family:var(--body);
    color:var(--ink);background:transparent;min-width:0}
  .ps-close{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:none;
    background:var(--paper);color:var(--gray);font-size:12px;cursor:pointer;display:grid;place-items:center}
  .ps-results:empty{display:none}
  .ps-row{display:flex;align-items:baseline;gap:8px;padding:12px 15px;cursor:pointer;
    border-bottom:1px solid var(--hair2)}
  .ps-row:active{background:var(--paper)}
  .ps-row .nm{font-size:15px;font-weight:600;color:var(--ink)}
  .ps-row .rg{font-size:12px;color:var(--gray)}
  .ps-favs{padding:10px 14px 14px}
  .ps-favs:empty{display:none}
  .ps-favhd{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gray);margin:4px 1px 9px}
  .ps-fav{display:inline-flex;align-items:center;gap:6px;background:var(--paper);
    border:1px solid var(--hair2);border-radius:100px;padding:7px 12px;margin:0 7px 7px 0;
    font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
  .ps-fav .x{color:var(--gray);font-size:11px;margin-left:2px}
  .ps-fav:active{background:var(--hair2)}
</style>
</head>
<body>
<div id="map"></div>

<div class="splash" id="splash">
  <h1>Regenradar</h1>
  <div class="sub">GeoSphere Austria · INCA · v6.32</div>
  <div class="pct" id="pct" style="display:none"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="stat" id="stat">Verbinde …</div>
</div>

<div class="hdr">
  <div class="right">
    <button class="placebtn" id="placeBtn" aria-label="Ort wählen">
      <span class="pin-ic">◍</span><span id="placeLabel">Wien</span><span class="chev">⌄</span>
    </button>
    <button class="locbtn" id="locate" title="Mein Standort" aria-label="Mein Standort"><span style="display:inline-block;transform:rotate(-45deg)">➤</span></button>
  </div>
  <div id="liveBadge" style="display:none!important"><span id="srcTxt"></span></div>
</div>

<!-- Ort-Such-Overlay -->
<div class="placesheet" id="placeSheet" hidden>
  <div class="ps-card">
    <div class="ps-search">
      <span class="ps-ic">⌕</span>
      <input id="placeInput" type="text" placeholder="Ort suchen …" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="ps-close" id="placeClose" aria-label="Schließen">✕</button>
    </div>
    <div class="ps-results" id="placeResults"></div>
    <div class="ps-favs" id="placeFavs"></div>
  </div>
</div>

<div class="legend" aria-hidden="true">
  <span>stark</span><div class="lbar"></div><span>leicht</span>
</div>

<div class="panel">
  <div class="row">
    <button class="playbtn" id="play" aria-label="Pause">⏸</button>
    <div class="timeinfo">
      <div class="t" id="time">––:––</div>
      <div class="rel" id="rel">Daten laden</div>
    </div>
    <button class="nowbtn" id="jumpNow" aria-label="Zu Jetzt springen">JETZT</button>
    <div class="badge" id="badge" style="display:none!important">INCA</div>
  </div>
  <div class="nc" id="ncTxt">
    <div class="ncmetrics">
      <span class="met" id="metTemp"><span class="v" id="ncT">–</span><span class="u">°</span></span>
      <span class="ncmsep">·</span>
      <span class="met" id="metRain"><span class="v" id="ncMM">0.0</span><span class="u">mm/h</span></span>
      <span class="ncmsep">·</span>
      <span class="met" id="metWind"><span class="v" id="ncW">–</span><span class="u">km/h</span><span class="u" id="ncWdir"></span></span>
    </div>
    <div class="ncbottom"><span class="ncloc" id="ncLoc">Wien</span><span id="ncMsg">–</span></div>
    <div class="agree" id="agreeRow">
      <span class="agreedot" id="agreeDot"></span>
      <span id="agreeTxt">Modelle werden verglichen …</span>
    </div>
  </div>
  <div class="tl">
    <div class="track" id="track" role="slider" aria-label="Zeitleiste" tabindex="0">
      <div class="strip" id="strip">
        <div class="striprail" id="rail"><div class="fut" id="futShade"></div></div>
      </div>
      <div class="playhead" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script id="wsrc" type="text/worker">
/* Daten-Worker: fetch + JSON.parse + Raster + Zugvektoren — alles
   abseits des Haupt-Threads, damit die Animation nie einfriert */
const GS='https://dataset.api.hub.geosphere.at/v1';
const AT={s:46.0,w:9.2,n:49.4,e:17.6};
const STRIPES=6, MAXF=33, PASTMIN=180;   /* 3 h zurück + bis ~8 h Prognose */
const midCos=Math.cos((AT.s+AT.n)/2*Math.PI/180);
const gW=Math.round((AT.e-AT.w)*111.32*midCos);
const gH=Math.round((AT.n-AT.s)*111.32);
const LEVELS=[0.05,0.2,0.5,1.0,2.5,5.0,10.0];
function levelFor(v){let l=0;for(let i=0;i<LEVELS.length;i++)if(v>=LEVELS[i])l=i+1;return l}
function writeStripe(timeMap,gj,limit){
  const times=(gj.timestamps||[]).slice(0,limit||Infinity).map(Date.parse);
  const grids=times.map(t=>{
    let g=timeMap.get(t);
    if(!g){g=new Uint8Array(gW*gH);timeMap.set(t,g)}
    return g;
  });
  for(const ft of gj.features||[]){
    const c=ft.geometry.coordinates;
    const x=Math.round((c[0]-AT.w)/(AT.e-AT.w)*(gW-1));
    const y=Math.round((AT.n-c[1])/(AT.n-AT.s)*(gH-1));
    if(x<0||y<0||x>=gW||y>=gH)continue;
    const arr=ft.properties&&ft.properties.parameters&&ft.properties.parameters.rr&&ft.properties.parameters.rr.data;
    if(!arr)continue;
    const idx=y*gW+x;
    for(let t=0;t<times.length;t++){
      const v=arr[t];if(v==null)continue;
      const l=levelFor(v);
      if(l>grids[t][idx])grids[t][idx]=l;
    }
  }
}
async function fetchGrid(url){
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),18000);   /* 18s pro Abruf, dann abbrechen */
  try{
    const res=await fetch(url,{signal:ctl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{clearTimeout(to)}
}
/* AROME-Grid: rr_acc ist akkumuliert seit Forecast-Start.
   Schritt 1: stuendliche Differenz = Regen je Stunde (mm/h).
   Schritt 2: nur jede 3. Stunde als Frame, Wert = Maximum der 3 Stunden.
   Sauber getrennt -> keine Indexfehler. */
function writeStripeArome(timeMap,gj,startMs){
  const ts=(gj.timestamps||[]).map(Date.parse);
  const maxT=startMs+48*3600000;
  const isFrame=ts.map(t=>t>=startMs&&t<=maxT&&new Date(t).getHours()%3===0);
  const grids=ts.map((t,i)=>{
    if(!isFrame[i])return null;
    let g=timeMap.get(t);
    if(!g){g=new Uint8Array(gW*gH);timeMap.set(t,g)}
    return g;
  });
  for(const ft of gj.features||[]){
    const c=ft.geometry.coordinates;
    const x=Math.round((c[0]-AT.w)/(AT.e-AT.w)*(gW-1));
    const y=Math.round((AT.n-c[1])/(AT.n-AT.s)*(gH-1));
    if(x<0||y<0||x>=gW||y>=gH)continue;
    const acc=ft.properties&&ft.properties.parameters&&ft.properties.parameters.rr_acc&&ft.properties.parameters.rr_acc.data;
    if(!acc)continue;
    const idx=y*gW+x;
    const hourly=new Array(ts.length).fill(0);
    for(let t=1;t<ts.length;t++){
      if(acc[t]==null||acc[t-1]==null)continue;
      hourly[t]=Math.max(0,acc[t]-acc[t-1]);
    }
    for(let t=0;t<ts.length;t++){
      if(!grids[t])continue;
      let peak=hourly[t];
      for(let k=1;k<3&&t-k>=0;k++)if(hourly[t-k]>peak)peak=hourly[t-k];
      const l=levelFor(peak/4);
      if(l>grids[t][idx])grids[t][idx]=l;
    }
  }
}
async function pool(tasks,limit){
  const results=[];let i=0;
  async function workerFn(){
    while(i<tasks.length){const j=i++;results[j]=await tasks[j]().catch(e=>({__err:e}))}
  }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},workerFn));
  return results;
}
function computeMotion(GR){
  const mkSmall=D=>{
    const sw=Math.floor(gW/D), sh=Math.floor(gH/D);
    return{sw,sh,fr:GR.map(g=>{
      const sm=new Float32Array(sw*sh);
      for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
        let sum=0;
        for(let dy=0;dy<D;dy++)for(let dx=0;dx<D;dx++)
          sum+=g[(y*D+dy)*gW+(x*D+dx)];
        sm[y*sw+x]=sum;
      }
      return sm;
    })};
  };
  const sad=(A,B,sw,sh,ox,oy,stride)=>{
    let s=0,cnt=0;
    const y0=Math.max(0,-oy),y1=sh-Math.max(0,oy);
    const x0=Math.max(0,-ox),x1=sw-Math.max(0,ox);
    for(let y=y0;y<y1;y+=stride)for(let x=x0;x<x1;x+=stride){
      const a=A[y*sw+x],b=B[(y+oy)*sw+(x+ox)];
      if(a===0&&b===0)continue;
      s+=Math.abs(a-b);cnt++;
    }
    return cnt<30?1e18:s/cnt;
  };
  const C=mkSmall(8), F=mkSmall(2);
  const motion=[];
  for(let j=0;j<GR.length-1;j++){
    let best=1e18,bx=0,by=0;
    for(let oy=-4;oy<=4;oy++)for(let ox=-4;ox<=4;ox++){
      const sc=sad(C.fr[j],C.fr[j+1],C.sw,C.sh,ox,oy,1);
      if(sc<best){best=sc;bx=ox;by=oy}
    }
    let fb=1e18,fx=bx*4,fy=by*4;
    for(let oy=by*4-5;oy<=by*4+5;oy++)for(let ox=bx*4-5;ox<=bx*4+5;ox++){
      const sc=sad(F.fr[j],F.fr[j+1],F.sw,F.sh,ox,oy,2);
      if(sc<fb){fb=sc;fx=ox;fy=oy}
    }
    motion.push({kx:fx*2,ky:fy*2});
  }
  return motion;
}
function smoothMotion(mo){
  return mo.map((m,j)=>{
    const a=mo[Math.max(0,j-1)],b=mo[Math.min(mo.length-1,j+1)];
    let kx=(a.kx+2*m.kx+b.kx)/4, ky=(a.ky+2*m.ky+b.ky)/4;
    const mag=Math.hypot(kx,ky);
    if(mag>30){kx*=30/mag;ky*=30/mag}
    return{kx,ky};
  });
}
self.onmessage=async e=>{
  if(e.data.cmd!=='load')return;
  const focusLL=e.data.focus||{lat:48.21,lon:16.37};
  try{
    const timeMap=new Map();
    const stripes=[];
    for(let i=0;i<STRIPES;i++){
      const w=AT.w+(AT.e-AT.w)*i/STRIPES, ee=AT.w+(AT.e-AT.w)*(i+1)/STRIPES;
      stripes.push(AT.s+','+w.toFixed(3)+','+AT.n+','+ee.toFixed(3));
    }

    /* ===== STUFE 1: EIN lokaler Abruf (±0.6°≈65km, ~3s, immer zuverlässig) =====
       Sofort ein nutzbares Radar, Splash weg, bevor ganz AT lädt. */
    const r=0.6;
    const localBB=Math.max(AT.s,focusLL.lat-r)+','+Math.max(AT.w,focusLL.lon-r)+','+
                  Math.min(AT.n,focusLL.lat+r)+','+Math.min(AT.e,focusLL.lon+r);
    try{
      const gjL=await fetchGrid(GS+'/grid/forecast/nowcast-v1-15min-1km?parameters=rr&bbox='+localBB+'&output_format=geojson');
      writeStripe(timeMap,gjL,MAXF);
      const lt=[...timeMap.keys()].sort((a,b)=>a-b);
      if(lt.length){
        const lg=lt.map(t=>timeMap.get(t));
        const lm=smoothMotion(computeMotion(lg));
        const lc=lg.map(g=>g.slice().buffer);
        self.postMessage({type:'done',times:lt,grids:lc,motion:lm,ncEndTime:lt[lt.length-1],partial:true},lc);
      }
    }catch(_){}

    /* ===== STUFE 2: ganz Österreich parallel nachladen (Hintergrund) =====
       Scheitern ist hier unkritisch — lokales Bild ist schon da. */
    const end=new Date(),start=new Date(Date.now()-PASTMIN*60000);
    const tasks=[];
    for(const bb of stripes)tasks.push(async()=>{
      try{
        const gj=await fetchGrid(GS+'/grid/forecast/nowcast-v1-15min-1km?parameters=rr&bbox='+bb+'&output_format=geojson');
        writeStripe(timeMap,gj,MAXF);
        self.postMessage({type:'prog',label:'Lade ganz Österreich …'});
        return true;
      }catch(_){return false}
    });
    const res=await pool(tasks,2);
    const ncOk=res.slice(0,STRIPES).some(r=>r===true);
    if(!ncOk)throw new Error('Prognose nicht ladbar');

    /* AROME dahinter anhängen — darf den Start NICHT blockieren.
       Gesamtes AROME-Laden gegen 12s-Limit; was nicht kommt, fehlt halt. */
    const ncTimes=[...timeMap.keys()].sort((a,b)=>a-b);
    const ncEnd=ncTimes.length?ncTimes[ncTimes.length-1]:Date.now();
    const aTasks=stripes.map(bb=>async()=>{
      try{
        const gj=await fetchGrid(GS+'/grid/forecast/nwp-v1-1h-2500m?parameters=rr_acc&bbox='+bb+'&output_format=geojson');
        writeStripeArome(timeMap,gj,ncEnd+1);
        self.postMessage({type:'prog',label:'Lade Tagesvorhersage …'});
        return true;
      }catch(_){return false}
    });
    await Promise.race([
      pool(aTasks,1),
      new Promise(r=>setTimeout(r,12000))   /* AROME max 12s, dann weiter */
    ]);

    const times=[...timeMap.keys()].sort((a,b)=>a-b);
    const grids=times.map(t=>timeMap.get(t));
    const motion=smoothMotion(computeMotion(grids));
    const bufs=grids.map(g=>g.buffer);
    self.postMessage({type:'done',times,grids:bufs,motion,ncEndTime:ncEnd},bufs);
  }catch(err){
    self.postMessage({type:'err',msg:String((err&&err.message)||err)});
  }
};
</script>

<script>
/* ============================================================
   Regenradar AT — Swiss Utility · v4 "Feld-Morphing"
   Statt zwei fertige Bilder zu überblenden (Geister-Dissolve!)
   wird das DATENFELD selbst interpoliert: pro Augenblick wird aus
   advektiertem Frame A + B EIN Feld gemischt und daraus EIN Bild
   mit scharfen Isokanten gezeichnet → Konturen verformen sich echt.
   ============================================================ */
const GS_API='https://dataset.api.hub.geosphere.at/v1';
const AT={s:46.0,w:9.2,n:49.4,e:17.6};
const STRIPES=6, MAX_FUTURE=33, PAST_MIN=180;
const END_HOLD=1300;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PPF=56;

const map=L.map('map',{zoomControl:false,fadeAnimation:false}).setView([48.175,16.38],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OSM &copy; CARTO &middot; Daten: <a href="https://data.hub.geosphere.at">GeoSphere Austria</a> (CC-BY 4.0) / RainViewer',
  maxZoom:18,subdomains:'abcd'
}).addTo(map);

const $=id=>document.getElementById(id);
let _fpsEl=null,_fpsT=0,_fpsN=0;
if(location.search.includes('fps')){
  _fpsEl=document.createElement('div');
  _fpsEl.style.cssText='position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5000;background:#000;color:#0f0;font:bold 12px monospace;padding:4px 7px;border-radius:4px;pointer-events:none';
  document.body.appendChild(_fpsEl);
}
function _fpsTick(t,cost){
  if(!_fpsEl)return;
  _fpsN++;
  if(t-_fpsT>=500){
    const fps=Math.round(_fpsN/((t-_fpsT)/1000));
    _fpsEl.textContent='FPS '+fps+'  draw '+cost.toFixed(1)+'ms';
    _fpsT=t;_fpsN=0;
  }
}
const fmt=ms=>new Date(ms).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
function relFmt(min){
  const a=Math.abs(min);
  if(a<60)return a+' min';
  const h=Math.floor(a/60),m=a%60;
  return h+' h'+(m?' '+m+' min':'');
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200)}
const raf=()=>new Promise(r=>requestAnimationFrame(r));

/* ---------- Preloader ---------- */
let progDone=0,progTotal=1;
function progInit(total,label){progDone=0;progTotal=total;progSet(0,label)}
function progTick(label,w){progDone+=(w||1);progSet(progDone/progTotal,label)}
function progSet(f,label){
  /* kein Prozentwert mehr — Balken pulsiert (indeterminate), nur Label aktualisieren */
  if(label)$('stat').textContent=label;
}
function splashDone(){const s=$('splash');s.classList.add('done');
  setTimeout(()=>s.style.display='none',500)}

/* ---------- Klassen + Quantisierungs-LUT ---------- */
const LEVELS=[0.05,0.2,0.5,1.0,2.5,5.0,10.0];
const CLASS_RGBA=[null,
  [147,167,201,85],[62,143,243,200],[35,98,210,210],[63,72,204,215],
  [124,58,237,222],[224,49,49,230],[122,18,18,235]];
function levelFor(v){let l=0;for(let i=0;i<LEVELS.length;i++)if(v>=LEVELS[i])l=i+1;return l}
const LUT=new Uint32Array(256);
(function(){
  const buf=new ArrayBuffer(4),u8=new Uint8Array(buf),u32=new Uint32Array(buf);
  for(let g=0;g<256;g++){
    const l=Math.round(g/32);
    if(l<1){LUT[g]=0;continue}
    const c=CLASS_RGBA[Math.min(l,7)];
    u8[0]=c[0];u8[1]=c[1];u8[2]=c[2];u8[3]=c[3];
    LUT[g]=u32[0];
  }
})();

/* ---------- Master-Raster-Geometrie (1 px ≈ 1 km) ---------- */
const M={gW:0,gH:0,times:[],grids:[],motion:[],ncEnd:0};
(function(){
  const midCos=Math.cos((AT.s+AT.n)/2*Math.PI/180);
  M.gW=Math.round((AT.e-AT.w)*111.32*midCos);
  M.gH=Math.round((AT.n-AT.s)*111.32);
})();

/* ---------- Daten-Worker ----------
   Das JSON-Parsen von vielen MB fror den Haupt-Thread ein →
   sichtbares Stocken/Springen bei jedem Refresh. Die komplette
   Schwerarbeit (fetch, parse, Raster, Vektoren) läuft jetzt im
   Web Worker, das UI bekommt nur fertige Typed Arrays. */
const worker=new Worker(URL.createObjectURL(
  new Blob([document.getElementById('wsrc').textContent],{type:'text/javascript'})));

/* komplettes AT-Bild (2. done, ohne partial) still im Hintergrund übernehmen */
worker.addEventListener('message',e=>{
  const d=e.data;
  if(d.type!=='done'||d.partial)return;
  if(source!=='inca')return;
  pendingRefresh={times:d.times,grids:d.grids.map(b=>new Uint8Array(b)),
    motion:d.motion,ncEndTime:d.ncEndTime};
  if(!playing)commitRefresh();
});

function preloadAustria(showSplash){
  if(showSplash)progInit(STRIPES*8+MAX_FUTURE+6,'Verbinde mit GeoSphere …');
  return new Promise((resolve,reject)=>{
    const onMsg=e=>{
      const d=e.data;
      if(d.type==='prog'){if(showSplash)progTick(d.label,8)}
      else if(d.type==='done'){            /* erstes done = lokales Schnellbild */
        worker.removeEventListener('message',onMsg);
        resolve({times:d.times,grids:d.grids.map(b=>new Uint8Array(b)),motion:d.motion,ncEndTime:d.ncEndTime});
      }else if(d.type==='err'){
        worker.removeEventListener('message',onMsg);
        reject(new Error(d.msg));
      }
    };
    worker.addEventListener('message',onMsg);
    worker.postMessage({cmd:'load',focus:{lat:focus.lat,lon:focus.lon}});
  });
}

/* ---------- Vektor-Isolinien-Engine (SVG) ----------
   Feld glätten → Marching Squares pro Klassenschwelle → gefüllte
   Vektorpfade. Glatte Kurven statt Pixeltreppen, beliebig scharf
   bei jedem Zoom, kein Canvas-Readback (= kein GC-Ruckeln). */
const SVGNS='http://www.w3.org/2000/svg';

/* SVG-Element vorbereiten (viewBox = Pflicht, damit Leaflet beim Zoom
   korrekt mitskaliert — das ist der Kern des Fixes). */
const isoSvg=document.createElementNS(SVGNS,'svg');
isoSvg.setAttribute('xmlns',SVGNS);
isoSvg.setAttribute('viewBox','0 0 '+M.gW+' '+M.gH);
isoSvg.setAttribute('preserveAspectRatio','none');
const isoG=document.createElementNS(SVGNS,'g');
isoSvg.appendChild(isoG);
const isoPaths=[];
for(let l=1;l<=7;l++){
  const p=document.createElementNS(SVGNS,'path');
  const c=CLASS_RGBA[l];
  p.setAttribute('fill','rgb('+c[0]+','+c[1]+','+c[2]+')');
  p.setAttribute('fill-opacity',(c[3]/255*0.82).toFixed(3));
  p.setAttribute('fill-rule','nonzero');
  p.setAttribute('stroke','none');
  p.setAttribute('shape-rendering','geometricPrecision');
  isoG.appendChild(p);
  isoPaths[l]=p;
}
/* Geographische Bounds des Master-Rasters = ganz Österreich */
const isoBounds=L.latLngBounds([[AT.s,AT.w],[AT.n,AT.e]]);

/* Leaflets eingebautes SVGOverlay übernimmt Position + Zoom-Skalierung
   (erbt von ImageOverlay). setPaths schreibt nur die Pfaddaten. */
const isoLayer=L.svgOverlay(isoSvg,isoBounds,{opacity:1,interactive:false,className:'leaflet-zoom-animated'});
isoLayer.setPaths=function(dList){
  for(let l=1;l<=7;l++)isoPaths[l].setAttribute('d',dList[l]||'');
};
/* (alte Custom-Layer entfernt — L.svgOverlay übernimmt das Zoom-Verhalten) */

/* ---- Marching Squares: Schwelle thr auf Feld f (gw×gh) → SVG-Pfad ----
   Liefert gefüllte Kontur aller Zellen mit Wert >= thr. Lineare
   Interpolation der Kantenschnitte → glatte, sub-zellgenaue Linien. */
function smoothClosed(P){
  /* geschlossene Catmull-Rom-Spline → kubische Béziers; rundet Ecken */
  const n=P.length;
  let d='M'+P[0].x.toFixed(2)+' '+P[0].y.toFixed(2);
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n], p1=P[i], p2=P[(i+1)%n], p3=P[(i+2)%n];
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+='C'+c1x.toFixed(2)+' '+c1y.toFixed(2)+' '+c2x.toFixed(2)+' '+c2y.toFixed(2)+' '+p2.x.toFixed(2)+' '+p2.y.toFixed(2);
  }
  return d+'Z';
}
function isoPath(f,gw,gh,thr,cx0,cy0,cx1,cy1){
  cx0=cx0||0;cy0=cy0||0;cx1=cx1==null?gw:cx1;cy1=cy1==null?gh:cy1;
  let d='';
  const at=(x,y)=>f[y*gw+x];
  /* Zellgitter (gw-1)×(gh-1); pro Zelle Standard-MS-Cases als Liniensegmente,
     hier als gefüllte Fläche über Konturzug. Wir sammeln Segmente und
     verbinden sie grob — für Füllung reicht even-odd mit Zellpolygonen. */
  /* Performanter Ansatz: pro Zelle, die >=thr ist, ein Quadrat; Kanten
     zu Nachbarn <thr werden interpoliert eingezogen → glatte Ränder. */
  const t=thr;
  for(let y=Math.max(0,cy0);y<Math.min(gh-1,cy1);y++){
    for(let x=Math.max(0,cx0);x<Math.min(gw-1,cx1);x++){
      const v00=at(x,y),v10=at(x+1,y),v01=at(x,y+1),v11=at(x+1,y+1);
      let idx=0;
      if(v00>=t)idx|=1; if(v10>=t)idx|=2; if(v11>=t)idx|=4; if(v01>=t)idx|=8;
      if(idx===0)continue;
      const ix=(a,b)=>{const d0=t-a,d1=b-a;return d1===0?0.5:Math.max(0,Math.min(1,d0/d1))};
      const T={x:x+ix(v00,v10),y:y}, R={x:x+1,y:y+ix(v10,v11)},
            B={x:x+ix(v01,v11),y:y+1}, Lp={x:x,y:y+ix(v00,v01)};
      const P=[];
      // Eckpunkte + interpolierte Kantenpunkte je nach Case zum gefüllten Polygon
      const c00={x,y},c10={x:x+1,y},c11={x:x+1,y:y+1},c01={x,y:y+1};
      switch(idx){
        case 1:P.push(c00,T,Lp);break;
        case 2:P.push(T,c10,R);break;
        case 4:P.push(R,c11,B);break;
        case 8:P.push(Lp,B,c01);break;
        case 3:P.push(c00,c10,R,Lp);break;
        case 6:P.push(T,c10,c11,B);break;
        case 12:P.push(Lp,R,c11,c01);break;
        case 9:P.push(c00,T,B,c01);break;
        case 5:P.push(c00,T,R,c11,B,Lp);break;
        case 10:P.push(T,c10,R,B,c01,Lp);break;
        case 7:P.push(c00,c10,c11,B,Lp);break;
        case 11:P.push(c00,c10,R,B,c01);break;
        case 13:P.push(c00,T,R,c11,c01);break;
        case 14:P.push(T,c10,c11,c01,Lp);break;
        case 15:P.push(c00,c10,c11,c01);break;
      }
      if(P.length){
        d+='M'+P[0].x.toFixed(2)+' '+P[0].y.toFixed(2);
        for(let k=1;k<P.length;k++)d+='L'+P[k].x.toFixed(2)+' '+P[k].y.toFixed(2);
        d+='Z';
      }
    }
  }
  return d;
}

/* Viewport-unabhängig: wir glätten/morphen IMMER das volle AT-Feld in
   reduzierter Auflösung (schnell), Konturen sind dann scharf durch Vektor. */
const F={gw:0,gh:0,fields:null,tmpA:null,tmpB:null,mix:null};
function buildSmoothFields(){
  const D=2;
  const gw=Math.floor(M.gW/D), gh=Math.floor(M.gH/D);
  F.gw=gw;F.gh=gh;
  F.fields=M.grids.map(g=>{
    const n=gw*gh, a=new Float32Array(n), b=new Float32Array(n);
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      let mx=0;
      for(let dy=0;dy<D;dy++)for(let dx=0;dx<D;dx++){
        const v=g[(y*D+dy)*M.gW+(x*D+dx)];if(v>mx)mx=v;
      }
      a[y*gw+x]=mx;
    }
    /* Glättungspässe → von Natur aus runde Konturen */
    for(let p=0;p<5;p++){
      for(let i=0;i<n;i++)b[i]=(a[Math.max(0,i-1)]+2*a[i]+a[Math.min(n-1,i+1)])*0.25;
      for(let i=0;i<n;i++)a[i]=(b[Math.max(0,i-gw)]+2*b[i]+b[Math.min(n-1,i+gw)])*0.25;
    }
    return a;
  });
  F.mix=new Float32Array(gw*gh);
}

const LEVEL_THR=[0,0.5,1.5,2.5,3.5,4.5,5.5,6.5];  /* Schwellen zwischen Klassen */
let pos=0,playing=true,holdUntil=0,lastT=0;
let source=null;
const nowIdx=()=>{let k=0;frames.forEach((f,j)=>{if(!f.future)k=j});return k};
let frames=[];

let _lastDrawP=-999,_drawCost=0;
function drawMorph(p,force){
  if(!F.fields||!F.fields.length)return;
  /* Konturen nur neu berechnen, wenn sich Position spürbar geändert hat
     (Pfad-Neuberechnung ist das Teure, nicht die Anzeige) */
  if(!force&&Math.abs(p-_lastDrawP)<0.0015)return;
  const _t0=performance.now();
  _lastDrawP=p;
  const nn=F.fields.length;
  const i=Math.max(0,Math.min(nn-1,Math.floor(p))), f=Math.max(0,Math.min(1,p-i));
  const A=F.fields[i], B=F.fields[Math.min(i+1,nn-1)], mix=F.mix;
  const gw=F.gw,gh=F.gh;
  const m=(M.motion[Math.min(i,M.motion.length-1)])||{kx:0,ky:0};
  const adv=!REDUCED;
  /* advektierte Verschiebung in (halben) Master-Pixeln */
  const ax=adv?(f*m.kx/2):0, ay=adv?(f*m.ky/2):0;
  const bx=adv?(-(1-f)*m.kx/2):0, by=adv?(-(1-f)*m.ky/2):0;
  const sample=(fld,x,y)=>{
    const x0=Math.floor(x),y0=Math.floor(y);
    const fx=x-x0,fy=y-y0;
    const x1=x0+1,y1=y0+1;
    if(x1<0||y1<0||x0>=gw||y0>=gh)return 0;
    const g=(xx,yy)=>(xx<0||yy<0||xx>=gw||yy>=gh)?0:fld[yy*gw+xx];
    const a=g(x0,y0),b=g(x1,y0),c=g(x0,y1),d=g(x1,y1);
    return a*(1-fx)*(1-fy)+b*fx*(1-fy)+c*(1-fx)*fy+d*fx*fy;
  };
  let mx0=0,my0=0,mx1=gw,my1=gh;
  if(map&&map.getBounds){
    const bb=map.getBounds();
    const f2x=lon=>(lon-AT.w)/(AT.e-AT.w)*gw, f2y=lat=>(AT.n-lat)/(AT.n-AT.s)*gh;
    mx0=Math.max(0,Math.floor(f2x(bb.getWest())-4));
    mx1=Math.min(gw,Math.ceil(f2x(bb.getEast())+4));
    my0=Math.max(0,Math.floor(f2y(bb.getNorth())-4));
    my1=Math.min(gh,Math.ceil(f2y(bb.getSouth())+4));
  }
  mix.fill(0);
  for(let y=my0;y<my1;y++)for(let x=mx0;x<mx1;x++){
    const va=sample(A,x-ax,y-ay), vb=sample(B,x-bx,y-by);
    mix[y*gw+x]=va*(1-f)+vb*f;
  }
  let cx0=0,cy0=0,cx1=gw,cy1=gh;
  if(map&&map.getBounds){
    const bb=map.getBounds();
    const f2x=lon=>(lon-AT.w)/(AT.e-AT.w)*gw, f2y=lat=>(AT.n-lat)/(AT.n-AT.s)*gh;
    cx0=Math.max(0,Math.floor(f2x(bb.getWest())-3));
    cx1=Math.min(gw,Math.ceil(f2x(bb.getEast())+3));
    cy0=Math.max(0,Math.floor(f2y(bb.getNorth())-3));
    cy1=Math.min(gh,Math.ceil(f2y(bb.getSouth())+3));
  }
  const dList=[];
  for(let l=1;l<=7;l++)dList[l]=isoPath(mix,gw,gh,LEVEL_THR[l],cx0,cy0,cx1,cy1);
  isoSvg.setAttribute('viewBox','0 0 '+gw+' '+gh);
  isoLayer.setPaths(dList);
  _drawCost=performance.now()-_t0;
}

async function renderView(showProgress){
  if(source!=='inca'||!M.grids.length)return;
  buildSmoothFields();
  if(!map.hasLayer(isoLayer))isoLayer.addTo(map);
  if(showProgress){for(let k=0;k<MAX_FUTURE;k++)progTick('Bereite Darstellung …')}
  drawMorph(pos);
}

/* ---------- Anzeige / Engine ---------- */
function applyPos(){
  const n=frames.length;if(!n)return;
  pos=Math.max(0,Math.min(n-1,pos));
  const i=Math.floor(pos),f=pos-i;
  if(source==='inca'){
    drawMorph(pos);
  }else{
    const LA=0.78;
    if(frames[i].overlay)frames[i].overlay.setOpacity(1-f<0?0:(1-f)*LA);
    if(i+1<n&&frames[i+1].overlay)frames[i+1].overlay.setOpacity(f*LA);
    for(let j=0;j<n;j++)if(j!==i&&j!==i+1&&frames[j].overlay)frames[j].overlay.setOpacity(0);
  }
  const tA=frames[i].time,tB=frames[Math.min(i+1,n-1)].time;
  const t=tA+(tB-tA)*f;
  /* Tag voranstellen, wenn nicht heute (z.B. "Sa 14:30") */
  const dNow=new Date(), dT=new Date(t);

  $('time').textContent=(sameDay?'':wd+' ')+fmt(t);
  const diff=Math.round((t-Date.now())/60000);
  const fut=frames[Math.round(pos)].future;

  if(fut){
    rel.textContent=diff<=0?'gleich':'in '+relFmt(diff);

  }else{
    rel.textContent=diff>=-2?'jetzt':'vor '+relFmt(diff);

  }
  $('strip').style.transform='translateX('+($('track').clientWidth/2-(pos+0.5)*PPF)+'px)';
  updateFocusBox();
  updateAgreement();
}

let pendingRefresh=null;
function posForTime(t){
  if(!frames.length)return 0;
  if(t<=frames[0].time)return 0;
  for(let j=0;j<frames.length-1;j++)
    if(t<frames[j+1].time)
      return j+(t-frames[j].time)/(frames[j+1].time-frames[j].time);
  return frames.length-1;
}
/* Frische Daten werden NICHT mitten in der Animation getauscht, sondern
   am Schleifenende (natürlicher Schnitt). Die Position wird über die
   UHRZEIT statt den Frame-Index erhalten → kein Springen mehr. */
function commitRefresh(atWrap){
  if(!pendingRefresh)return;
  const pr=pendingRefresh;pendingRefresh=null;
  let tDisp=null;
  if(!atWrap&&frames.length){
    const i=Math.floor(pos),f=pos-i;
    tDisp=frames[i].time+(frames[Math.min(i+1,frames.length-1)].time-frames[i].time)*f;
  }
  M.times=pr.times;M.grids=pr.grids;M.motion=pr.motion;M.ncEnd=pr.ncEndTime||M.ncEnd;
  const NOW=Date.now()+60000;
  frames=M.times.map(t=>({time:t,future:t>NOW,overlay:null}));
  buildTimeline();tuneSpeed();
  if(tDisp!=null)pos=posForTime(tDisp);
  buildSmoothFields();
  drawMorph(pos);
}
let SEG_MS=1100;           /* Dauer pro Frame, dynamisch gesetzt */
function tuneSpeed(){
  /* ganzer Durchlauf zielt auf ~13 s, pro Frame zwischen 380 und 1100 ms */
  const n=Math.max(1,frames.length-1);
  SEG_MS=Math.max(380,Math.min(1100,Math.round(13000/n)));
}
function loop(t){
  requestAnimationFrame(loop);
  if(!frames.length){lastT=t;return}
  if(!playing){lastT=t;return}
  if(t<holdUntil){lastT=t;return}
  let dt=t-lastT;lastT=t;
  if(dt>200)dt=SEG_MS;      /* nach Tab-Wechsel/Hänger nicht springen */
  pos+=dt/SEG_MS;
  if(pos>=frames.length-1){
    pos=frames.length-1;applyPos();
    holdUntil=t+END_HOLD;
    setTimeout(()=>{if(playing){pos=0;commitRefresh(true)}},END_HOLD);
    return;
  }
  applyPos();
  _fpsTick(t,_drawCost);
}

/* ---------- Timeline-Band ---------- */
function buildTimeline(){
  const strip=$('strip'),rail=$('rail');
  rail.querySelectorAll('.seg').forEach(s=>s.remove());
  strip.querySelectorAll('.hlabel,.nowmk').forEach(s=>s.remove());
  const n=frames.length;
  strip.style.width=(n*PPF)+'px';
  let aromeStart=-1;
  for(let j=0;j<n;j++){
    const d=new Date(frames[j].time);
    const onHour=d.getMinutes()===0;
    const isArome=M.ncEnd&&frames[j].time>M.ncEnd+1800000;
    if(isArome&&aromeStart<0)aromeStart=j;
    if(j>0){
      const sg=document.createElement('div');
      sg.className='seg'+(onHour?' hour':'');
      sg.style.left=(j*PPF)+'px';rail.appendChild(sg);
    }
    if(onHour){
      const sp=document.createElement('span');
      sp.className='hlabel';
      /* AROME über mehrere Tage → bei 00:00 Datum statt Uhrzeit */
      sp.textContent=(isArome&&d.getHours()===0)
        ? d.toLocaleDateString('de-AT',{weekday:'short'})
        : fmt(frames[j].time).replace(':00','');
      sp.style.left=((j+0.5)*PPF)+'px';strip.appendChild(sp);
    }
  }
  /* AROME-Bereich dezent absetzen (Trennlinie + Label) */
  if(aromeStart>0){
    const div=document.createElement('div');div.className='aromemark';
    div.style.left=(aromeStart*PPF)+'px';strip.appendChild(div);
  }
  const fi=frames.findIndex(f=>f.future);
  const fs=$('futShade');
  if(fi>0){
    fs.style.left=(fi*PPF)+'px';fs.style.width=((n-fi)*PPF)+'px';
    const nm=document.createElement('div');nm.className='nowmk';
    nm.style.left=(fi*PPF)+'px';strip.appendChild(nm);
  }else{
    fs.style.left='0';fs.style.width=(fi===0?n*PPF:0)+'px';
  }
}

/* ---------- Fokus-Punkt + mm/h-Box ----------
   Holt für GPS-Standort (oder Wien-Fallback) die mm/h-Zeitreihe von INCA
   (Rückblick + Prognose) und zeigt in der Box live den Wert zur aktuell
   gewählten Timeline-Position. */
const focus={lat:48.2082,lon:16.3738,name:'Wien',times:[],vals:[],temp:[],wind:[],wdir:[],hasWind:false,marker:null,models:null};
const WDIRS=['N','NO','O','SO','S','SW','W','NW'];
const windArrow=deg=>{const a=['↑','↗','→','↘','↓','↙','←','↖'];return a[Math.round(((deg||0)%360)/45)%8]};
function setFocusMarker(){

  focus.marker=L.circleMarker([focus.lat,focus.lon],
    {radius:6,color:'#E03131',weight:2,fillColor:'#fff',fillOpacity:1,zIndexOffset:1000}).addTo(map);

async function loadFocusSeries(){
  try{
    const ll=focus.lat.toFixed(4)+','+focus.lon.toFixed(4);
    /* Nowcast (15min, ~3h) + AROME (1h, bis 48h) parallel holen */
    const [nc,ar]=await Promise.allSettled([
      fetch(`${GS_API}/timeseries/forecast/nowcast-v1-15min-1km?parameters=rr,t2m,ff,dd&lat_lon=${ll}`).then(r=>r.json()),
      fetch(`${GS_API}/timeseries/forecast/nwp-v1-1h-2500m?parameters=rr_acc,t2m,u10m,v10m&lat_lon=${ll}`).then(r=>r.json())
    ]);
    /* Maps je Größe: rr15(mm/15min), rrH(mm/h), temp, windms, wdir */
    const T=new Map(),RR=new Map(),TP=new Map(),WS=new Map(),WD=new Map();
    /* Nowcast übernehmen */
    if(nc.status==='fulfilled'){
      const j=nc.value, ts=(j.timestamps||[]).map(Date.parse);
      const pr=j.features&&j.features[0]&&j.features[0].properties&&j.features[0].properties.parameters||{};
      const g=k=>pr[k]&&pr[k].data||[];
      const rr=g('rr'),tp=g('t2m'),ff=g('ff'),dd=g('dd');
      for(let i=0;i<ts.length;i++){
        T.set(ts[i],1);
        if(rr[i]!=null)RR.set(ts[i],rr[i]*4);      /* mm/15min → mm/h */
        if(tp[i]!=null)TP.set(ts[i],tp[i]);
        if(ff[i]!=null)WS.set(ts[i],ff[i]);
        if(dd[i]!=null)WD.set(ts[i],dd[i]);
      }
    }
    /* AROME anhängen (nur Zeiten nach Nowcast-Ende) */
    const ncMax=Math.max(0,...[...T.keys()]);
    if(ar.status==='fulfilled'){
      const j=ar.value, ts=(j.timestamps||[]).map(Date.parse);
      const pr=j.features&&j.features[0]&&j.features[0].properties&&j.features[0].properties.parameters||{};
      const g=k=>pr[k]&&pr[k].data||[];
      const acc=g('rr_acc'),tp=g('t2m'),u=g('u10m'),v=g('v10m');
      let prevAcc=null;
      for(let i=0;i<ts.length;i++){
        const hourly=(prevAcc==null||acc[i]==null)?0:Math.max(0,acc[i]-prevAcc);
        if(acc[i]!=null)prevAcc=acc[i];
        if(ts[i]<=ncMax)continue;                  /* Überlapp: Nowcast gewinnt */
        T.set(ts[i],1);
        RR.set(ts[i],hourly);                       /* schon mm/h */
        if(tp[i]!=null)TP.set(ts[i],tp[i]);
        if(u[i]!=null&&v[i]!=null){
          WS.set(ts[i],Math.hypot(u[i],v[i]));
          WD.set(ts[i],(270-Math.atan2(v[i],u[i])*180/Math.PI)%360);
        }
      }
    }
    focus.times=[...T.keys()].sort((a,b)=>a-b);
    focus.vals=focus.times.map(t=>RR.has(t)?RR.get(t):null);  /* mm/h */
    focus.temp=focus.times.map(t=>TP.has(t)?TP.get(t):null);
    focus.wind=focus.times.map(t=>WS.has(t)?WS.get(t):null);  /* m/s */
    focus.wdir=focus.times.map(t=>WD.has(t)?WD.get(t):null);
    focus.hasWind=WS.size>0;
    $('ncLoc').textContent=focus.name;
    $('ncTxt').classList.add('show');
    updateFocusBox();
    loadModelCompare();   /* Open-Meteo Modellvergleich (asynchron) */
  }catch(e){}
}
/* ---------- Modellvergleich via Open-Meteo (ICON, ECMWF, AROME) ----------
   Drei unabhängige Modelle für den Fokuspunkt. Pro Stunde zählen wir, wie
   viele "Regen" (>=0.1 mm/h) sagen → Einigkeits-Ampel. */
const OM_MODELS=[
  {id:'icon_seamless',name:'ICON'},      /* DWD, Mitteleuropa */
  {id:'ecmwf_ifs025',name:'ECMWF'},      /* europäische Referenz */
  {id:'gfs_seamless',name:'GFS'}         /* NOAA */
];
async function loadModelCompare(){
  try{
    const ll='latitude='+focus.lat.toFixed(4)+'&longitude='+focus.lon.toFixed(4);
    const url='https://api.open-meteo.com/v1/forecast?'+ll+
      '&hourly=precipitation&models='+OM_MODELS.map(m=>m.id).join(',')+
      '&forecast_days=3&timezone=UTC';
    const r=await fetch(url);if(!r.ok)return;
    const j=await r.json();
    const h=j.hourly;if(!h||!h.time)return;
    const times=h.time.map(t=>Date.parse(t+'Z'));
    const series=OM_MODELS.map(m=>h['precipitation_'+m.id]||null);
    focus.models={times,series,names:OM_MODELS.map(m=>m.name)};
    updateAgreement();
  }catch(e){}
}
function updateAgreement(){
  const M=focus.models, row=$('agreeRow');
  if(!frames.length){return}
  const i=Math.floor(pos),f=pos-i;
  const tA=frames[i].time,tB=frames[Math.min(i+1,frames.length-1)].time;
  const tNow=tA+(tB-tA)*f;
  /* Index im Open-Meteo-Raster (falls vorhanden) */
  let idx=-1,best=1e15;
  if(M){for(let k=0;k<M.times.length;k++){const d=Math.abs(M.times[k]-tNow);if(d<best){best=d;idx=k}}}
  if(M&&(idx<0||best>2*3600000))idx=-1;
  let rain=0,have=0;
  const chips=[];
  /* GeoSphere als 1. Stimme — echter Wert aus der bereits geladenen
     Standort-Zeitreihe (mm/h), nicht über Open-Meteo */
  const gsv=seriesAt(focus.vals,tNow);
  if(gsv!=null){
    have++;
    const wet=gsv>=0.1;
    if(wet)rain++;
    chips.push('<span class="mchip '+(wet?'wet':'dry')+'">'+(wet?'🌧':'☀')+' GeoSphere</span>');
  }
  if(M&&idx>=0)M.series.forEach((s,mi)=>{
    if(!s||s[idx]==null)return;
    have++;
    const wet=s[idx]>=0.1;
    if(wet)rain++;
    chips.push('<span class="mchip '+(wet?'wet':'dry')+'">'+
      (wet?'🌧':'☀')+' '+M.names[mi]+'</span>');
  });
  if(!have){row.classList.remove('show');return}
  row.classList.add('show');
  row.classList.remove('high','mid','low');
  let head;
  if(rain===0){row.classList.add('high');head='<b>'+have+'/'+have+'</b> trocken';}
  else if(rain===have){row.classList.add('high');head='<b>'+have+'/'+have+'</b> Regen';}
  else{row.classList.add('mid');head='<b>'+rain+'/'+have+'</b> Regen';}
  $('agreeTxt').innerHTML=head+' &nbsp;'+chips.join(' ');
}
/* generische Zeitreihen-Interpolation */
function seriesAt(arr,tMs){
  const T=focus.times;if(!T.length||!arr)return null;
  /* außerhalb des abgedeckten Zeitraums: kein Wert (ehrlich, statt kleben) */
  if(tMs<T[0]-450000||tMs>T[T.length-1]+1800000)return null;
  if(tMs<=T[0])return arr[0];
  if(tMs>=T[T.length-1])return arr[arr.length-1];
  for(let i=0;i<T.length-1;i++)if(tMs<T[i+1]){
    const a=arr[i],b=arr[i+1];if(a==null||b==null)return a!=null?a:b;
    const f=(tMs-T[i])/(T[i+1]-T[i]);return a*(1-f)+b*f;
  }
  return arr[arr.length-1];
}
/* mm/h-Wert zur Anzeige-Zeit (nutzt dieselbe null-tolerante Interpolation) */
function focusValueAt(tMs){return seriesAt(focus.vals,tMs);}
function updateFocusBox(){
  if(!focus.times.length||!frames.length)return;
  const i=Math.floor(pos),f=pos-i;
  const tA=frames[i].time,tB=frames[Math.min(i+1,frames.length-1)].time;
  const tNow=tA+(tB-tA)*f;
  const vRaw=focusValueAt(tNow);          /* bereits mm/h, null wenn außerhalb */
  const v=vRaw==null?0:vRaw;
  $('ncMM').textContent=vRaw==null?'–':(v<0.05?'0.0':(v<1?v.toFixed(1):v.toFixed(v<10?1:0)));
  $('metRain').classList.toggle('rainon',v>=0.4);
  const tp=seriesAt(focus.temp,tNow);
  $('ncT').textContent=tp==null?'–':Math.round(tp);
  const wd=seriesAt(focus.wind,tNow);
  if(wd==null||!focus.hasWind){
    $('metWind').style.display='none';
  }else{
    $('metWind').style.display='';
    $('ncW').textContent=Math.round(wd*3.6); /* m/s → km/h */
    const dr=seriesAt(focus.wdir,tNow);
    $('ncWdir').textContent=dr==null?'':' '+windArrow(dr);
  }
  if(seriesAt(focus.temp,tNow)==null)$('metTemp').style.display='none';
  else $('metTemp').style.display='';
  /* nächster Regen ab jetzt */
  const now=Date.now();
  let firstRain=-1;
  for(let k=0;k<focus.times.length;k++)
    if(focus.times[k]>=now-300000&&focus.vals[k]>=0.1){firstRain=k;break}
  const msg=$('ncMsg');
  if(v>=0.1){
    msg.innerHTML='<b>Regen</b> zur gewählten Zeit';
  }else if(firstRain===-1){
    msg.innerHTML='Kein Regen in den nächsten Stunden';
  }else{
    const mins=Math.max(0,Math.round((focus.times[firstRain]-now)/60000));
    msg.innerHTML=mins<=5?'<b>Es regnet</b> gerade'
      :`<b>Regen ab ${fmt(focus.times[firstRain])}</b> · in ~${relFmt(mins)}`;
  }
}

    const NOW=Date.now()+60000;
    frames=M.times.map(t=>({time:t,future:t>NOW,overlay:null}));
    source='inca';
    $('srcTxt').textContent='LIVE · INCA';$('liveBadge').classList.remove('off');
    buildTimeline();tuneSpeed();pos=nowIdx();
    await renderView(true);
    progSet(1,'Fertig');
    splashDone();
    /* Fokus startet auf Wien (kein Standort-Dialog beim ersten Öffnen);
       GPS aktiviert man bewusst über den ◎-Button */
    setFocusMarker();
    loadFocusSeries();
  }catch(e){
    console.warn('INCA fehlgeschlagen:',e);
    progSet(1,'Fallback …');
    try{await loadRainViewer();toast('GeoSphere nicht erreichbar – RainViewer-Fallback aktiv')}
    catch(e2){$('rel').textContent='Keine Radardaten verfügbar';setPlaying(false)}
    splashDone();
  }
  setInterval(async()=>{
    if(source!=='inca'){loadRainViewer().catch(()=>{});return}
    try{
      const d=await preloadAustria(false);
      const motion=d.motion;
      pendingRefresh={times:d.times,grids:d.grids,motion,ncEndTime:d.ncEndTime};
      if(!playing)commitRefresh();   /* pausiert → sofort übernehmen */
    }catch(e){}
  },600000);
})();
</script>
</body>
</html>
