<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Regenradar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* ===== Swiss Utility · Token-Set ===== */
  :root{
    --paper:#F4F4F1; --card:#FFFFFF; --hair:#DDDDD6; --hair2:#E9E9E4;
    --ink:#141513; --gray:#70746F; --signal:#E03131;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--paper);font-family:var(--body);color:var(--ink);overflow:hidden}
  #map{position:fixed;inset:0;background:var(--paper)}
  .leaflet-container{background:var(--paper)}
  .leaflet-image-layer{will-change:opacity}
  .leaflet-control-zoom{display:none}
  .leaflet-control-attribution{background:rgba(244,244,241,.75)!important;color:var(--gray)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--gray)!important}

  /* ===== Preloader ===== */
  .splash{position:fixed;inset:0;z-index:3000;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    transition:opacity .45s ease}
  .splash.done{opacity:0;pointer-events:none}
  .splash h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .splash .sub{font-size:10px;font-weight:500;color:var(--gray);letter-spacing:.14em;
    text-transform:uppercase;margin-top:6px}
  .splash .pct{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;margin-top:42px;line-height:1}
  .splash .bar{width:min(280px,70vw);height:6px;background:var(--hair2);margin-top:18px;position:relative}
  .splash .bar i{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--signal);transition:width .25s ease}
  .splash .stat{font-size:10px;font-weight:500;color:var(--gray);letter-spacing:.1em;
    text-transform:uppercase;margin-top:14px;min-height:13px}

  /* Header */
  .hdr{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;
    background:linear-gradient(var(--paper) 55%,rgba(244,244,241,0));pointer-events:none}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .hdr .right{display:flex;align-items:center;gap:10px;pointer-events:auto}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--signal)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);position:relative}
  .live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--signal);
    animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(.5);opacity:.9}80%,100%{transform:scale(1.6);opacity:0}}
  .live.off{color:var(--gray)}
  .live.off .dot{background:var(--gray)}
  .live.off .dot::after{display:none}
  .locbtn{background:var(--card);border:1px solid var(--hair);color:var(--ink);
    width:40px;height:40px;border-radius:4px;display:grid;place-items:center;cursor:pointer;font-size:17px}
  .locbtn:active{transform:scale(.94)}
  .locbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* Panel */
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);
    border-top:1px solid var(--hair);
    padding:15px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .row{display:flex;align-items:center;gap:13px}
  .playbtn{flex:0 0 auto;width:46px;height:46px;border-radius:4px;border:none;cursor:pointer;
    background:var(--signal);color:#fff;font-size:17px;display:grid;place-items:center}
  .playbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .timeinfo{flex:1;min-width:0}
  .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
  .rel{font-size:11px;font-weight:500;color:var(--gray);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .nowbtn{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.12em;cursor:pointer;
    padding:6px 10px;border-radius:2px;border:1px solid var(--hair);background:var(--card);color:var(--gray)}
  .nowbtn:active{transform:scale(.95)}
  .badge{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.12em;
    padding:5px 9px;border-radius:2px;border:1px solid var(--ink);color:var(--ink)}
  .badge.fc{border-color:var(--signal);color:var(--signal)}

  .nc{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair2);
    font-size:13px;color:var(--gray);display:none;gap:8px;align-items:center}
  .nc.show{display:flex}
  .nc .ncdot{width:8px;height:8px;background:var(--ink);flex:0 0 auto}
  .nc.rain .ncdot{background:var(--signal)}
  .nc b{color:var(--ink);font-weight:600}

  /* Timeline: Tape — Nadel fix in der Mitte, Band läuft dahinter */
  .tl{margin-top:14px}
  .track{position:relative;height:54px;touch-action:none;cursor:grab;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .track:active{cursor:grabbing}
  .strip{position:absolute;top:0;bottom:0;left:0;will-change:transform}
  .striprail{position:absolute;left:0;right:0;top:14px;height:14px;background:var(--hair2)}
  .striprail .fut{position:absolute;top:0;bottom:0;
    background:repeating-linear-gradient(90deg,var(--hair2) 0 4px,var(--hair) 4px 5px)}
  .seg{position:absolute;top:3px;bottom:3px;width:1px;background:#D6D6CF}
  .seg.hour{top:0;bottom:0;background:#B9B9B0}
  .hlabel{position:absolute;top:35px;transform:translateX(-50%);
    font-size:10px;font-weight:500;color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
  .nowmk{position:absolute;top:11px;height:20px;width:2px;background:var(--ink)}
  .nowmk::after{content:"JETZT";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-size:8px;font-weight:700;letter-spacing:.13em;color:var(--gray)}
  .playhead{position:absolute;left:50%;top:10px;height:22px;width:2px;background:var(--signal);
    transform:translateX(-50%);pointer-events:none;z-index:2}
  .playhead::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
    border:4px solid transparent;border-top:5px solid var(--signal)}

  /* Legende */
  .legend{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:999;
    background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:10px 9px;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .lbar{width:8px;height:110px;
    background:linear-gradient(to top,
      rgba(147,167,201,.85) 0 14%,#3E8FF3 14% 28%,#2362D2 28% 42%,
      #3F48CC 42% 57%,#7C3AED 57% 71%,#E03131 71% 86%,#7A1212 86% 100%)}
  .legend span{font-size:8.5px;font-weight:500;color:var(--gray);letter-spacing:.08em;
    writing-mode:vertical-rl;transform:rotate(180deg)}

  .toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);
    z-index:1100;background:var(--ink);color:var(--paper);border-radius:4px;max-width:88%;
    padding:9px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  .toast.show{opacity:1}

  @media (prefers-reduced-motion:reduce){.live .dot::after{animation:none}}
</style>
</head>
<body>
<div id="map"></div>

<div class="splash" id="splash">
  <h1>Regenradar</h1>
  <div class="sub">GeoSphere Austria · INCA · v3.1</div>
  <div class="pct" id="pct">0%</div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="stat" id="stat">Verbinde …</div>
</div>

<div class="hdr">
  <div class="brand"><h1>Regenradar</h1></div>
  <div class="right">
    <div class="live off" id="liveBadge"><div class="dot"></div><span id="srcTxt">VERBINDE</span></div>
    <button class="locbtn" id="locate" title="Mein Standort" aria-label="Mein Standort">◎</button>
  </div>
</div>

<div class="legend" aria-hidden="true">
  <span>stark</span><div class="lbar"></div><span>leicht</span>
</div>

<div class="panel">
  <div class="row">
    <button class="playbtn" id="play" aria-label="Pause">⏸</button>
    <div class="timeinfo">
      <div class="t" id="time">––:––</div>
      <div class="rel" id="rel">Daten laden</div>
    </div>
    <button class="nowbtn" id="jumpNow" aria-label="Zu Jetzt springen">JETZT</button>
    <div class="badge" id="badge">INCA</div>
  </div>
  <div class="nc" id="ncTxt"><div class="ncdot"></div><span id="ncMsg"></span></div>
  <div class="tl">
    <div class="track" id="track" role="slider" aria-label="Zeitleiste" tabindex="0">
      <div class="strip" id="strip">
        <div class="striprail" id="rail"><div class="fut" id="futShade"></div></div>
      </div>
      <div class="playhead" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Regenradar AT — Swiss Utility · v3 "Ganz Österreich"
   Architektur:
   1) Preload: INCA-Daten für GANZ Österreich in 6 Längsstreifen
      parallel laden → kompaktes Master-Raster im Speicher (~6 MB)
   2) Preloader mit echtem Fortschritt, App erst sichtbar wenn fertig
   3) Anzeige: sichtbarer Ausschnitt wird LOKAL aus dem Master
      gerendert — Pan/Zoom durch ganz AT ohne weitere Netz-Anfragen
   Daten: GeoSphere Austria (CC-BY 4.0) · Fallback RainViewer
   ============================================================ */
const GS_API='https://dataset.api.hub.geosphere.at/v1';
const AT={s:46.0,w:9.2,n:49.4,e:17.6};
const STRIPES=6;
const MAX_FUTURE=21;          /* 21 × 15 min ≈ +5 h */
const PAST_MIN=60;
const END_HOLD=1300, LAYER_ALPHA=0.78;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PPF=56;
addEventListener('resize',()=>frames.length&&applyPos());

const map=L.map('map',{zoomControl:false,fadeAnimation:false}).setView([48.175,16.38],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OSM &copy; CARTO &middot; Daten: <a href="https://data.hub.geosphere.at">GeoSphere Austria</a> (CC-BY 4.0) / RainViewer',
  maxZoom:18,subdomains:'abcd'
}).addTo(map);

const $=id=>document.getElementById(id);
const fmt=ms=>new Date(ms).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
function relFmt(min){
  const a=Math.abs(min);
  if(a<60)return a+' min';
  const h=Math.floor(a/60),m=a%60;
  return h+' h'+(m?' '+m+' min':'');
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200)}
const raf=()=>new Promise(r=>requestAnimationFrame(r));

/* ---------- Preloader ---------- */
let progDone=0,progTotal=1;
function progInit(total,label){progDone=0;progTotal=total;progSet(0,label)}
function progTick(label){progDone++;progSet(progDone/progTotal,label)}
function progSet(f,label){
  const p=Math.min(100,Math.round(f*100));
  $('pct').textContent=p+'%';
  $('barFill').style.width=p+'%';
  if(label)$('stat').textContent=label;
}
function splashDone(){const s=$('splash');s.classList.add('done');
  setTimeout(()=>s.style.display='none',500)}

/* ---------- Intensitätsklassen ---------- */
const LEVELS=[0.05,0.2,0.5,1.0,2.5,5.0,10.0];
const CLASS_RGBA=[null,
  [147,167,201,85],
  [62,143,243,200],
  [35,98,210,210],
  [63,72,204,215],
  [124,58,237,222],
  [224,49,49,230],
  [122,18,18,235]];
function levelFor(v){let l=0;for(let i=0;i<LEVELS.length;i++)if(v>=LEVELS[i])l=i+1;return l}

/* ---------- Master-Raster: ganz Österreich, 1 px ≈ 1 km ---------- */
const M={gW:0,gH:0,timeMap:new Map(),times:[],grids:[]};
(function(){
  const midCos=Math.cos((AT.s+AT.n)/2*Math.PI/180);
  M.gW=Math.round((AT.e-AT.w)*111.32*midCos);
  M.gH=Math.round((AT.n-AT.s)*111.32);
})();
function gridOf(timeMs){
  let g=M.timeMap.get(timeMs);
  if(!g){g=new Uint8Array(M.gW*M.gH);M.timeMap.set(timeMs,g)}
  return g;
}
function writeStripe(gj,limit){
  const times=(gj.timestamps||[]).slice(0,limit||Infinity).map(Date.parse);
  const grids=times.map(gridOf);
  for(const ft of gj.features||[]){
    const c=ft.geometry.coordinates;
    const x=Math.round((c[0]-AT.w)/(AT.e-AT.w)*(M.gW-1));
    const y=Math.round((AT.n-c[1])/(AT.n-AT.s)*(M.gH-1));
    if(x<0||y<0||x>=M.gW||y>=M.gH)continue;
    const arr=ft.properties?.parameters?.rr?.data;if(!arr)continue;
    const idx=y*M.gW+x;
    for(let t=0;t<times.length;t++){
      const v=arr[t];if(v==null)continue;
      const l=levelFor(v);
      if(l>grids[t][idx])grids[t][idx]=l;
    }
  }
}
async function fetchGrid(url){
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}
async function pool(tasks,limit){
  const results=[];let i=0;
  async function worker(){
    while(i<tasks.length){const j=i++;results[j]=await tasks[j]().catch(e=>({__err:e}))}
  }
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},worker));
  return results;
}

/* ---------- Preload: ganz Österreich in Streifen ---------- */
async function preloadAustria(showSplash){
  const stripes=[];
  for(let i=0;i<STRIPES;i++){
    const w=AT.w+(AT.e-AT.w)*i/STRIPES, e=AT.w+(AT.e-AT.w)*(i+1)/STRIPES;
    stripes.push(`${AT.s},${w.toFixed(3)},${AT.n},${e.toFixed(3)}`);
  }
  const end=new Date(),start=new Date(Date.now()-PAST_MIN*60000);
  const tasks=[];
  for(const bb of stripes)tasks.push(async()=>{
    const gj=await fetchGrid(`${GS_API}/grid/forecast/nowcast-v1-15min-1km?parameters=rr&bbox=${bb}&output_format=geojson`);
    writeStripe(gj,MAX_FUTURE);
    if(showSplash)progTick('Lade Prognose …');
    return true;
  });
  for(const bb of stripes)tasks.push(async()=>{
    const gj=await fetchGrid(`${GS_API}/grid/historical/inca-v1-15min-1km?parameters=rr&bbox=${bb}`+
      `&start=${start.toISOString().slice(0,16)}&end=${end.toISOString().slice(0,16)}&output_format=geojson`);
    writeStripe(gj);
    if(showSplash)progTick('Lade Rückblick …');
    return true;
  });
  if(showSplash)progInit(tasks.length+MAX_FUTURE,'Verbinde mit GeoSphere …');
  const res=await pool(tasks,3);
  /* Prognose ist Pflicht: mindestens 1 Streifen muss da sein */
  const ncOk=res.slice(0,STRIPES).some(r=>r===true);
  if(!ncOk)throw(res[0]&&res[0].__err)||new Error('Prognose nicht ladbar');
  M.times=[...M.timeMap.keys()].sort((a,b)=>a-b);
  M.grids=M.times.map(t=>M.timeMap.get(t));
}

/* ---------- Zugrichtung schätzen (Block-Matching auf grobem Raster) ----------
   Pro Frame-Paar: Verschiebung in km, die die Felder am besten zur Deckung
   bringt. Beim Abspielen wandern beide Bilder entlang dieses Vektors →
   der Regen "zieht", statt zu verschwinden und neu aufzutauchen. */
function computeMotion(){
  const mkSmall=D=>{
    const sw=Math.floor(M.gW/D), sh=Math.floor(M.gH/D);
    return{sw,sh,fr:M.grids.map(g=>{
      const sm=new Float32Array(sw*sh);
      for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
        let sum=0;
        for(let dy=0;dy<D;dy++)for(let dx=0;dx<D;dx++)
          sum+=g[(y*D+dy)*M.gW+(x*D+dx)];
        sm[y*sw+x]=sum;
      }
      return sm;
    })};
  };
  const sad=(A,B,sw,sh,ox,oy,stride)=>{
    let s=0,cnt=0;
    const y0=Math.max(0,-oy),y1=sh-Math.max(0,oy);
    const x0=Math.max(0,-ox),x1=sw-Math.max(0,ox);
    for(let y=y0;y<y1;y+=stride)for(let x=x0;x<x1;x+=stride){
      const a=A[y*sw+x],b=B[(y+oy)*sw+(x+ox)];
      if(a===0&&b===0)continue;
      s+=Math.abs(a-b);cnt++;
    }
    return cnt<30?1e18:s/cnt;
  };
  const C=mkSmall(8), F=mkSmall(2);
  M.motion=[];
  for(let j=0;j<M.grids.length-1;j++){
    /* Grobstufe: 8-km-Schritte, ±32 km */
    let best=1e18,bx=0,by=0;
    for(let oy=-4;oy<=4;oy++)for(let ox=-4;ox<=4;ox++){
      const sc=sad(C.fr[j],C.fr[j+1],C.sw,C.sh,ox,oy,1);
      if(sc<best){best=sc;bx=ox;by=oy}
    }
    /* Feinstufe: 2-km-Schritte rund um den Grobtreffer —
       Regen zieht in 15 min meist nur 5–12 km, die Grobstufe
       allein rundet das auf null (darum bewegte sich nichts) */
    let fb=1e18,fx=bx*4,fy=by*4;
    for(let oy=by*4-5;oy<=by*4+5;oy++)for(let ox=bx*4-5;ox<=bx*4+5;ox++){
      const sc=sad(F.fr[j],F.fr[j+1],F.sw,F.sh,ox,oy,2);
      if(sc<fb){fb=sc;fx=ox;fy=oy}
    }
    M.motion.push({kx:fx*2,ky:fy*2});   /* km */
  }
}
const AT_MIDCOS=Math.cos((AT.s+AT.n)/2*Math.PI/180);
function setShift(ov,kx,ky){
  const b=ov._base;if(!b)return;
  const dLat=-ky/111.32, dLon=kx/(111.32*AT_MIDCOS);
  ov.setBounds([[b.bs+dLat,b.bw+dLon],[b.bn+dLat,b.be+dLon]]);
}

/* ---------- Viewport lokal aus dem Master rendern ---------- */
function renderSlice(grid,gx0,gy0,gw,gh,S){
  const n=gw*gh;
  const a=new Float32Array(n), b=new Float32Array(n);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)
    a[y*gw+x]=grid[(gy0+y)*M.gW+(gx0+x)];
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const i=y*gw+x;
    if(a[i]>0){b[i]=a[i];continue}
    let m=0;
    if(x>0&&a[i-1]>m)m=a[i-1];
    if(x<gw-1&&a[i+1]>m)m=a[i+1];
    if(y>0&&a[i-gw]>m)m=a[i-gw];
    if(y<gh-1&&a[i+gw]>m)m=a[i+gw];
    b[i]=m*0.6;
  }
  for(let i=0;i<n;i++)a[i]=(b[Math.max(0,i-1)]+2*b[i]+b[Math.min(n-1,i+1)])*0.25;
  for(let i=0;i<n;i++)b[i]=(a[Math.max(0,i-gw)]+2*a[i]+a[Math.min(n-1,i+gw)])*0.25;
  const small=document.createElement('canvas');small.width=gw;small.height=gh;
  const sctx=small.getContext('2d');
  const im=sctx.createImageData(gw,gh);
  for(let i=0;i<n;i++){im.data[i*4]=Math.min(255,b[i]*32);im.data[i*4+3]=255}
  sctx.putImageData(im,0,0);
  const W=gw*S,H=gh*S;
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const octx=out.getContext('2d');
  octx.imageSmoothingEnabled=true;octx.imageSmoothingQuality='high';
  octx.drawImage(small,0,0,W,H);
  const img=octx.getImageData(0,0,W,H),d=img.data;
  for(let k=0;k<d.length;k+=4){
    const l=Math.round(d[k]/32);
    if(l<1){d[k+3]=0;continue}
    const c=CLASS_RGBA[Math.min(l,7)];
    d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=c[3];
  }
  octx.putImageData(img,0,0);
  const url=out.toDataURL();
  small.width=small.height=0;out.width=out.height=0;
  return url;
}

let frames=[],pos=0,playing=true,holdUntil=0,lastT=0;
let source=null,renderedRect=null,renderToken=0;
const frameMs=()=>frames.length>14?620:850;
const nowIdx=()=>{let k=0;frames.forEach((f,j)=>{if(!f.future)k=j});return k};

async function renderView(showProgress){
  if(source!=='inca'||!M.grids.length)return;
  const token=++renderToken;
  const b=map.getBounds(),pad=0.3;
  let s=Math.max(AT.s,b.getSouth()-(b.getNorth()-b.getSouth())*pad);
  let n=Math.min(AT.n,b.getNorth()+(b.getNorth()-b.getSouth())*pad);
  let w=Math.max(AT.w,b.getWest()-(b.getEast()-b.getWest())*pad);
  let e=Math.min(AT.e,b.getEast()+(b.getEast()-b.getWest())*pad);
  let gx0=Math.max(0,Math.floor((w-AT.w)/(AT.e-AT.w)*M.gW));
  let gy0=Math.max(0,Math.floor((AT.n-n)/(AT.n-AT.s)*M.gH));
  let gx1=Math.min(M.gW,Math.ceil((e-AT.w)/(AT.e-AT.w)*M.gW));
  let gy1=Math.min(M.gH,Math.ceil((AT.n-s)/(AT.n-AT.s)*M.gH));
  const gw=Math.max(8,gx1-gx0),gh=Math.max(8,gy1-gy0);
  const S=Math.min(12,Math.max(2,Math.floor(700/Math.max(gw,gh))));
  /* exakte Geo-Grenzen des Ausschnitts zurückrechnen */
  const bw=AT.w+gx0/M.gW*(AT.e-AT.w), be=AT.w+(gx0+gw)/M.gW*(AT.e-AT.w);
  const bn=AT.n-gy0/M.gH*(AT.n-AT.s), bs=AT.n-(gy0+gh)/M.gH*(AT.n-AT.s);
  const bounds=[[bs,bw],[bn,be]];

  const ni=nowIdx(),order=[ni];
  for(let d=1;d<frames.length;d++){
    if(ni+d<frames.length)order.push(ni+d);
    if(ni-d>=0)order.push(ni-d);
  }
  const fresh=new Array(frames.length).fill(null);
  for(const j of order){
    if(token!==renderToken)return;          /* neuer Render gestartet → abbrechen */
    const url=renderSlice(M.grids[j],gx0,gy0,gw,gh,S);
    const ov=L.imageOverlay(url,bounds,{opacity:0,zIndex:200,interactive:false}).addTo(map);
    ov._base={bs,bw,bn,be};
    const old=frames[j].overlay;
    frames[j].overlay=ov;fresh[j]=ov;
    if(old)map.removeLayer(old);
    if(j===ni)applyPos();
    if(showProgress)progTick('Rendere Radar …');
    await raf();
  }
  renderedRect={gx0,gy0,gx1,gy1};
  applyPos();
}

/* ---------- Crossfade-Engine (nur 2 sichtbare Layer) ---------- */
let visA=-1,visB=-1;
function applyPos(){
  const n=frames.length;if(!n)return;
  pos=Math.max(0,Math.min(n-1,pos));
  const i=Math.floor(pos),f=pos-i;
  if(visA!==-1&&visA!==i&&visA!==i+1&&frames[visA]&&frames[visA].overlay)frames[visA].overlay.setOpacity(0);
  if(visB!==-1&&visB!==i&&visB!==i+1&&frames[visB]&&frames[visB].overlay)frames[visB].overlay.setOpacity(0);
  if(frames[i].overlay)frames[i].overlay.setOpacity((1-f)*LAYER_ALPHA);
  if(i+1<n&&frames[i+1].overlay)frames[i+1].overlay.setOpacity(f*LAYER_ALPHA);
  if(source==='inca'&&!REDUCED&&M.motion&&M.motion.length){
    const m=M.motion[Math.min(i,M.motion.length-1)];
    if(frames[i].overlay)setShift(frames[i].overlay,m.kx*f,m.ky*f);
    if(i+1<n&&frames[i+1].overlay)setShift(frames[i+1].overlay,-m.kx*(1-f),-m.ky*(1-f));
  }
  visA=i;visB=i+1<n?i+1:-1;
  const tA=frames[i].time,tB=frames[Math.min(i+1,n-1)].time;
  const t=tA+(tB-tA)*f;
  $('time').textContent=fmt(t);
  const diff=Math.round((t-Date.now())/60000);
  const fut=frames[Math.round(pos)].future;
  const rel=$('rel'),badge=$('badge');
  if(fut){
    rel.textContent=diff<=0?'Prognose':'Prognose · in '+relFmt(diff);
    badge.textContent='PROGNOSE';badge.classList.add('fc');
  }else{
    rel.textContent=diff>=-2?'Jetzt':'Vor '+relFmt(diff);
    badge.textContent=source==='inca'?'INCA':'RADAR';badge.classList.remove('fc');
  }
  $('strip').style.transform='translateX('+($('track').clientWidth/2-(pos+0.5)*PPF)+'px)';
}

function loop(t){
  requestAnimationFrame(loop);
  if(!playing||!frames.length){lastT=t;return}
  if(t<holdUntil){lastT=t;return}
  const dt=Math.min(t-lastT,100);lastT=t;
  if(REDUCED){
    loop._acc=(loop._acc||0)+dt;
    if(loop._acc>=frameMs()){loop._acc=0;pos=Math.floor(pos)+1;
      if(pos>frames.length-1){pos=0;holdUntil=t+END_HOLD}}
  }else{
    pos+=dt/frameMs();
    if(pos>=frames.length-1){pos=frames.length-1;applyPos();holdUntil=t+END_HOLD;
      setTimeout(()=>{if(playing)pos=0},END_HOLD);return}
  }
  applyPos();
}
requestAnimationFrame(loop);

function setPlaying(p){playing=p;
  $('play').textContent=p?'⏸':'▶';
  $('play').setAttribute('aria-label',p?'Pause':'Abspielen')}
$('play').addEventListener('click',()=>setPlaying(!playing));
$('jumpNow').addEventListener('click',()=>{pos=nowIdx();applyPos()});

function clearFrames(){frames.forEach(f=>f.overlay&&map.removeLayer(f.overlay));frames=[];visA=visB=-1}

/* ---------- Timeline-Band ---------- */
function buildTimeline(){
  const strip=$('strip'),rail=$('rail');
  rail.querySelectorAll('.seg').forEach(s=>s.remove());
  strip.querySelectorAll('.hlabel,.nowmk').forEach(s=>s.remove());
  const n=frames.length;
  strip.style.width=(n*PPF)+'px';
  for(let j=0;j<n;j++){
    const onHour=new Date(frames[j].time).getMinutes()===0;
    if(j>0){
      const s=document.createElement('div');
      s.className='seg'+(onHour?' hour':'');
      s.style.left=(j*PPF)+'px';rail.appendChild(s);
    }
    if(onHour){
      const sp=document.createElement('span');
      sp.className='hlabel';
      sp.textContent=fmt(frames[j].time).replace(':00','');
      sp.style.left=((j+0.5)*PPF)+'px';strip.appendChild(sp);
    }
  }
  const fi=frames.findIndex(f=>f.future);
  const fs=$('futShade');
  if(fi>0){
    fs.style.left=(fi*PPF)+'px';fs.style.width=((n-fi)*PPF)+'px';
    const nm=document.createElement('div');nm.className='nowmk';
    nm.style.left=(fi*PPF)+'px';strip.appendChild(nm);
  }else{
    fs.style.left='0';fs.style.width=(fi===0?n*PPF:0)+'px';
  }
}

/* ---------- Band ziehen ---------- */
const track=$('track');
track.addEventListener('pointerdown',e=>{
  setPlaying(false);
  const startX=e.clientX,startPos=pos;
  track.setPointerCapture(e.pointerId);
  track.onpointermove=ev=>{
    pos=Math.max(0,Math.min(frames.length-1,startPos+(startX-ev.clientX)/PPF));
    applyPos();
  };
});
track.addEventListener('pointerup',()=>track.onpointermove=null);
track.addEventListener('pointercancel',()=>track.onpointermove=null);
track.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){setPlaying(false);pos=Math.min(frames.length-1,Math.floor(pos)+1);applyPos()}
  if(e.key==='ArrowLeft'){setPlaying(false);pos=Math.max(0,Math.ceil(pos)-1);applyPos()}
  if(e.key===' '){e.preventDefault();setPlaying(!playing)}
});

/* ---------- Fallback: RainViewer ---------- */
async function loadRainViewer(){
  const res=await fetch('https://api.rainviewer.com/public/weather-maps.json');
  const data=await res.json();
  const mk=(f,fut)=>({time:f.time*1000,future:fut,
    overlay:L.tileLayer(data.host+f.path+'/256/{z}/{x}/{y}/4/1_1.png',{opacity:0,zIndex:200}).addTo(map)});
  clearFrames();
  frames=[...(data.radar.past||[]).map(f=>mk(f,false)),
          ...(data.radar.nowcast||[]).map(f=>mk(f,true))];
  if(!frames.length)throw new Error('keine Frames');
  source='rainviewer';
  $('srcTxt').textContent='RAINVIEWER';$('liveBadge').classList.add('off');
  buildTimeline();pos=nowIdx();applyPos();
}

/* ---------- Punkt-Prognose am Standort ---------- */
async function pointNowcast(lat,lon){
  try{
    const url=`${GS_API}/timeseries/forecast/nowcast-v1-15min-1km?parameters=rr&lat_lon=${lat.toFixed(4)},${lon.toFixed(4)}`;
    const res=await fetch(url);if(!res.ok)return;
    const j=await res.json();
    const ts=j.timestamps||[];
    const data=j.features?.[0]?.properties?.parameters?.rr?.data||[];
    const box=$('ncTxt'),msg=$('ncMsg');
    const first=data.findIndex(v=>v!=null&&v>=0.1);
    if(first===-1){
      box.classList.remove('rain');
      msg.innerHTML='<b>Kein Regen</b> in den nächsten Stunden an deinem Standort';
    }else{
      const mins=Math.max(0,Math.round((Date.parse(ts[first])-Date.now())/60000));
      box.classList.add('rain');
      msg.innerHTML=mins<=5?'<b>Es regnet</b> gerade an deinem Standort'
        :`<b>Regen ab ca. ${fmt(Date.parse(ts[first]))}</b> · in ~${relFmt(mins)}`;
    }
    box.classList.add('show');
  }catch(e){}
}
async function getPosition(){
  const Geo=window.Capacitor?.Plugins?.Geolocation;
  if(Geo){
    const p=await Geo.getCurrentPosition({enableHighAccuracy:false,timeout:10000});
    return[p.coords.latitude,p.coords.longitude];
  }
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('unsupported'));
    navigator.geolocation.getCurrentPosition(
      p=>res([p.coords.latitude,p.coords.longitude]),rej);
  });
}
$('locate').addEventListener('click',async()=>{
  try{
    const ll=await getPosition();
    map.flyTo(ll,11,{duration:.8});
    L.circleMarker(ll,{radius:7,color:'#E03131',weight:2,fillColor:'#E03131',fillOpacity:.35}).addTo(map);
    pointNowcast(ll[0],ll[1]);
  }catch(e){toast('Standort nicht freigegeben')}
});

/* ---------- Neu rendern beim Pan/Zoom (rein lokal, kein Netz) ---------- */
let moveT=null,lastZoom=map.getZoom();
map.on('moveend',()=>{
  if(source!=='inca'||!renderedRect)return;
  const z=map.getZoom();
  const b=map.getBounds();
  const gx0=Math.floor((b.getWest()-AT.w)/(AT.e-AT.w)*M.gW);
  const gx1=Math.ceil((b.getEast()-AT.w)/(AT.e-AT.w)*M.gW);
  const gy0=Math.floor((AT.n-b.getNorth())/(AT.n-AT.s)*M.gH);
  const gy1=Math.ceil((AT.n-b.getSouth())/(AT.n-AT.s)*M.gH);
  const out=gx0<renderedRect.gx0||gx1>renderedRect.gx1||gy0<renderedRect.gy0||gy1>renderedRect.gy1;
  const zoomed=Math.abs(z-lastZoom)>=1;
  if(!out&&!zoomed)return;
  lastZoom=z;
  clearTimeout(moveT);
  moveT=setTimeout(()=>renderView(false),450);
});

/* ---------- Boot ---------- */
(async()=>{
  try{
    await preloadAustria(true);
    computeMotion();
    /* Frames aus dem Master aufbauen */
    const NOW=Date.now()+60000;
    frames=M.times.map(t=>({time:t,future:t>NOW,overlay:null}));
    source='inca';
    $('srcTxt').textContent='LIVE · INCA';$('liveBadge').classList.remove('off');
    buildTimeline();pos=nowIdx();
    await renderView(true);
    progSet(1,'Fertig');
    splashDone();
  }catch(e){
    console.warn('INCA fehlgeschlagen:',e);
    progSet(1,'Fallback …');
    try{await loadRainViewer();toast('GeoSphere nicht erreichbar – RainViewer-Fallback aktiv')}
    catch(e2){$('rel').textContent='Keine Radardaten verfügbar';setPlaying(false)}
    splashDone();
  }
  /* alle 10 min im Hintergrund frische Daten (ohne Splash) */
  setInterval(async()=>{
    if(source!=='inca'){loadRainViewer().catch(()=>{});return}
    try{
      M.timeMap.clear();
      await preloadAustria(false);
      computeMotion();
      const NOW=Date.now()+60000;
      const keep=pos-nowIdx();
      clearFrames();
      frames=M.times.map(t=>({time:t,future:t>NOW,overlay:null}));
      buildTimeline();pos=Math.max(0,Math.min(frames.length-1,nowIdx()+keep));
      renderedRect=null;
      await renderView(false);
    }catch(e){}
  },600000);
})();
</script>
